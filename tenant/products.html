<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=81" />
    <style>
      #tenant-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #fafafa;
        color: #525252;
        font: 600 1rem/1.5 "Source Sans 3", system-ui, sans-serif;
        text-align: center;
        z-index: 9999;
      }
      #tenant-status[hidden] { display: none; }
      body.tenant-error .profile-nav,
      body.tenant-error .products-catalog-main,
      body.tenant-error .site-footer { opacity: 0.2; pointer-events: none; }
    </style>
  </head>
  <body class="tpl-profile page-products">
    <div id="tenant-status">Loading your site…</div>

    <nav class="profile-nav" id="profile-nav">
      <div class="container profile-nav__inner">
        <a class="profile-brand" href="/">
          <div class="profile-brand__logo" id="profile-logo-placeholder" aria-hidden="true"></div>
          <span id="profile-brand-name">Your Brand</span>
        </a>
        <div class="profile-nav__links" id="profile-nav-links" hidden>
          <div class="profile-nav__tabs" id="profile-nav-tabs" hidden>
            <a class="profile-nav__link" href="/certifications" data-nav-page="certifications" id="profile-nav-link-certifications" hidden>Certifications</a>
            <a class="profile-nav__link" href="/products" data-nav-page="products" id="profile-nav-link-products" hidden>Shop</a>
          </div>
        </div>
        <div class="profile-nav__actions">
          <button type="button" class="profile-nav__menu-btn" id="profile-nav-menu-btn" aria-expanded="false" aria-controls="profile-nav-drawer" aria-label="Open menu" hidden>
            <span></span><span></span><span></span>
          </button>
          <a class="profile-book-btn" href="/booking">Book Now</a>
        </div>
      </div>
      <div class="profile-nav__drawer" id="profile-nav-drawer" hidden>
        <div class="container profile-nav__drawer-inner">
          <div class="profile-nav__drawer-tabs" id="profile-nav-drawer-tabs" hidden>
            <a class="profile-nav__drawer-link" href="/certifications" data-nav-page="certifications" id="profile-nav-drawer-certifications" hidden>Certifications</a>
            <a class="profile-nav__drawer-link" href="/products" data-nav-page="products" id="profile-nav-drawer-products" hidden>Shop</a>
          </div>
        </div>
      </div>
    </nav>

    <main class="products-catalog-main" id="products-catalog-main">
      <div class="container">
        <a class="products-catalog-back" href="/">← Back</a>
        <div class="profile-portfolio-head products-catalog-head">
          <h1 id="products-catalog-title">Shop</h1>
          <p class="profile-menu-blurb" id="products-catalog-blurb"></p>
        </div>
        <div class="products-catalog-grid" id="products-catalog-grid"></div>
        <p class="products-catalog-empty" id="products-catalog-empty" hidden>No products available right now.</p>
      </div>
    </main>

    <footer class="site-footer site-footer--home-promo">
      <div class="container footer-bottom">
        <p id="preview-footer-brand">&copy; Your brand name</p>
        <p class="footer-built-by">
          <a class="footer-built-by__link" href="https://styldd.com" target="_blank" rel="noopener noreferrer">
            <img class="footer-built-by__logo" src="/assets/styld-icon.png" alt="" width="22" height="22" decoding="async" />
            <span>Built with Styld</span>
          </a>
        </p>
      </div>
    </footer>

    <div class="profile-product-modal" id="profile-product-modal" hidden>
      <div class="profile-product-modal__backdrop" data-product-modal-close></div>
      <div class="profile-product-modal__dialog" role="dialog" aria-modal="true" aria-labelledby="profile-product-modal-title">
        <button type="button" class="profile-product-modal__close" data-product-modal-close aria-label="Close">&times;</button>
        <div class="profile-product-modal__gallery">
          <button type="button" class="profile-product-modal__nav profile-product-modal__nav--prev" data-product-modal-prev aria-label="Previous photo" hidden>&#8249;</button>
          <img class="profile-product-modal__image" id="profile-product-modal-image" alt="" />
          <button type="button" class="profile-product-modal__nav profile-product-modal__nav--next" data-product-modal-next aria-label="Next photo" hidden>&#8250;</button>
          <p class="profile-product-modal__counter" id="profile-product-modal-counter" hidden></p>
        </div>
        <div class="profile-product-modal__body">
          <h2 class="profile-product-modal__title" id="profile-product-modal-title"></h2>
          <p class="profile-product-modal__price" id="profile-product-modal-price"></p>
          <p class="profile-product-modal__desc" id="profile-product-modal-desc"></p>
          <div class="profile-product-modal__actions" id="profile-product-modal-actions"></div>
        </div>
      </div>
    </div>

    <script src="/js/vercel-analytics.bundle.js" defer></script>
    <script src="/js/styld-tenant-config.js?v=1780530043880"></script>
    <script src="/js/styld-tenant-config.local.js?v=1780530043880"></script>
    <script src="/js/styld-tenant-shared.js?v=77"></script>
    <script src="/js/profile-content.js?v=39"></script>
    <script src="/js/tenant-site.js?v=70"></script>
  </body>
</html>
