<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
    <title>Loading…</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500&family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,700&family=Inter:wght@400;500;600;700&family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Montserrat:wght@400;500;600;700&family=Nunito:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,500;0,600;0,700;1,500&family=Poppins:wght@400;500;600;700&family=Source+Sans+3:wght@400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/css/styles.css?v=63" />
    <style>
      #tenant-status {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        padding: 2rem;
        background: #fafafa;
        color: #525252;
        font: 600 1rem/1.5 "Source Sans 3", system-ui, sans-serif;
        text-align: center;
        z-index: 9999;
      }
      #tenant-status[hidden] { display: none; }
      body.tenant-error .profile-nav,
      body.tenant-error .profile-hero,
      body.tenant-error .profile-menu-section,
      body.tenant-error .profile-faq-section,
      body.tenant-error .profile-location-section,
      body.tenant-error .site-footer { opacity: 0.2; pointer-events: none; }
    </style>
  </head>
  <body class="tpl-profile page-home page-splash">
    <div id="tenant-status">Loading your site…</div>

    <nav class="profile-nav" id="profile-nav">
      <div class="container profile-nav__inner">
        <a class="profile-brand" href="/">
          <div class="profile-brand__logo" id="profile-logo-placeholder" aria-hidden="true"></div>
          <span id="profile-brand-name">Your Brand</span>
        </a>
        <div class="profile-nav__links" id="profile-nav-links" hidden>
          <div class="profile-nav__tabs" id="profile-nav-tabs" hidden>
            <a class="profile-nav__link" href="/certifications" data-nav-page="certifications" id="profile-nav-link-certifications" hidden>Certifications</a>
            <a class="profile-nav__link" href="/products" data-nav-page="products" id="profile-nav-link-products" hidden>Shop</a>
          </div>
        </div>
        <div class="profile-nav__actions">
          <button type="button" class="profile-nav__menu-btn" id="profile-nav-menu-btn" aria-expanded="false" aria-controls="profile-nav-drawer" aria-label="Open menu" hidden>
            <span></span><span></span><span></span>
          </button>
          <a class="profile-book-btn" href="/booking">Book Now</a>
        </div>
      </div>
      <div class="profile-nav__drawer" id="profile-nav-drawer" hidden>
        <div class="container profile-nav__drawer-inner">
          <div class="profile-nav__drawer-tabs" id="profile-nav-drawer-tabs" hidden>
            <a class="profile-nav__drawer-link" href="/certifications" data-nav-page="certifications" id="profile-nav-drawer-certifications" hidden>Certifications</a>
            <a class="profile-nav__drawer-link" href="/products" data-nav-page="products" id="profile-nav-drawer-products" hidden>Shop</a>
          </div>
        </div>
      </div>
    </nav>

    <section class="profile-hero">
      <div class="container profile-hero__grid">
        <div class="profile-photo" id="profile-photo-wrap">
          <div class="profile-photo__bg" id="profile-hero-photo"></div>
        </div>
      </div>
    </section>

    <div class="profile-below-hero" id="profile-below-hero">
    <div id="site-main-content">
      <div class="container profile-main-intro">
        <div class="profile-info" id="profile-info-block"></div>
      </div>

    <main>
      <div class="profile-section-block" id="profile-about-block" data-site-section="aboutMe">
        <h2 class="profile-about-head" id="profile-about-title">About Me</h2>
        <p class="profile-about-body" id="profile-about-body"></p>
      </div>
      <div class="profile-section-block" id="profile-policy-block" data-site-section="policies">
        <h3 class="profile-policy-head">Policies</h3>
        <ul class="profile-policy-body" id="profile-policy-body"></ul>
      </div>
      <section class="profile-reviews-section" id="profile-reviews-section" data-site-section="reviews" hidden>
        <div class="container">
          <div class="profile-reviews-head">
            <h2>Client Reviews</h2>
          </div>
          <div class="site-reviews-marquee" aria-label="Client Reviews">
            <div class="site-reviews-marquee__fade site-reviews-marquee__fade--left" aria-hidden="true"></div>
            <div class="site-reviews-marquee__viewport">
              <div class="site-reviews-marquee__track" id="site-reviews-track"></div>
            </div>
            <div class="site-reviews-marquee__fade site-reviews-marquee__fade--right" aria-hidden="true"></div>
          </div>
        </div>
      </section>

      <section class="profile-portfolio-section" id="profile-portfolio-section" data-site-section="portfolio" hidden>
        <div class="container">
          <div class="profile-portfolio-head profile-portfolio-head--row">
            <div class="profile-portfolio-head__text">
              <h2 id="profile-portfolio-title">Previous work</h2>
              <p class="profile-menu-blurb" id="profile-portfolio-blurb"></p>
            </div>
            <a class="profile-portfolio-view-more" id="profile-portfolio-view-more" href="/portfolio" hidden>View more</a>
          </div>
        </div>
        <div class="profile-portfolio-carousel" id="profile-portfolio-carousel" aria-label="Previous work preview">
          <div class="profile-portfolio-carousel__track" id="profile-portfolio-carousel-track"></div>
        </div>
      </section>

      <section class="profile-menu-section" id="profile-menu-section" data-site-section="menu">
        <div class="container">
          <div class="profile-menu-head">
            <h2 id="profile-menu-title">Menu</h2>
            <p class="profile-menu-blurb" id="profile-menu-blurb"></p>
          </div>
          <div id="profile-menu-filters" class="profile-menu-filters" hidden></div>
          <div id="profile-service-grid" class="profile-service-grid"></div>
        </div>
      </section>

      <section class="profile-faq-section" id="profile-faq-section" data-site-section="faq" hidden>
        <div class="container">
          <div class="profile-faq-head">
            <h2 id="profile-faq-title">FAQ</h2>
            <p class="profile-faq-blurb" id="profile-faq-blurb" hidden></p>
          </div>
          <div class="profile-faq-list" id="profile-faq-list"></div>
        </div>
      </section>

      <section class="profile-location-section" id="profile-location-section" data-site-section="visit">
        <div class="container">
          <div class="profile-location-head">
            <h2 id="profile-visit-title">Location</h2>
          </div>
          <div class="profile-location-card">
            <div class="profile-location-info" id="profile-location-info"></div>
            <iframe
              class="profile-location-map"
              id="profile-map"
              title="Location map"
              loading="lazy"
              referrerpolicy="no-referrer-when-downgrade"
            ></iframe>
          </div>
        </div>
      </section>
    </main>
    </div>

    <footer class="site-footer site-footer--home-promo">
      <div class="container footer-bottom">
        <p id="preview-footer-brand">&copy; Your brand name</p>
        <p class="footer-built-by">
          <a class="footer-built-by__link" href="https://styldd.com" target="_blank" rel="noopener noreferrer">
            <img class="footer-built-by__logo" src="/assets/styld-icon.png" alt="" width="22" height="22" decoding="async" />
            <span>Built with Styld</span>
          </a>
        </p>
      </div>
    </footer>
    </div>

    <div class="profile-portfolio-lightbox" id="profile-portfolio-lightbox" hidden>
      <div class="profile-portfolio-lightbox__backdrop" data-portfolio-lightbox-close></div>
      <button class="profile-portfolio-lightbox__close" type="button" data-portfolio-lightbox-close aria-label="Close">&times;</button>
      <div class="profile-portfolio-lightbox__stage" id="profile-portfolio-lightbox-stage"></div>
    </div>

    <script src="/js/vercel-analytics.bundle.js" defer></script>
    <script src="/js/styld-tenant-config.js?v=1780530043880"></script>
    <script src="/js/styld-tenant-config.local.js?v=1780530043880"></script>
    <script src="/js/styld-tenant-shared.js?v=82"></script>
    <script src="/js/profile-content.js?v=49"></script>
    <script src="/js/site-reviews.js?v=1"></script>
    <script src="/js/tenant-site.js?v=71"></script>
  </body>
</html>
